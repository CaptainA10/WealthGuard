# WealthGuard CI/CD (cahier des charges §2.7): test -> build -> deploy.
#
# Runs on GitHub Actions, not GitLab CI, because the repository lives on
# GitHub (an explicit choice by the project owner -- see CLAUDE.md's
# "Pieges connus"). The three-stage shape the cahier des charges asks for
# (test / build / deploy) is kept regardless of platform.
#
# The `test-python` job is the one worth reading closely: it builds and boots
# the real Spring Boot jar and spins up a real PostgreSQL service container,
# then runs the *entire* pytest suite -- unit and integration alike. Nothing
# here is mocked: this is the same coverage the developer environment gets
# once Postgres and the quality engine are both up, just running unattended.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push that lands while a previous run for the same branch is still going
# cancels that older run rather than leaving it to finish and fail for
# reasons the next push already fixed -- exactly what happened once here
# (see CLAUDE.md): a run started right before a fix landed stayed visible
# as a stale "failure" in the Actions list, superseded but not cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-java:
    name: Test — Java quality engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn verify (JUnit 5 + JaCoCo 85% branch-coverage gate)
        run: mvn -B verify
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: quality-engine/target/site/jacoco
          retention-days: 7

  test-python:
    name: Test — Python pipeline (unit + integration)
    runs-on: ubuntu-latest
    needs: test-java
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wealthguard
          POSTGRES_USER: wealthguard
          POSTGRES_PASSWORD: wealthguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wealthguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AZURE_POSTGRESQL_HOST: localhost
      AZURE_POSTGRESQL_PORT: 5432
      AZURE_POSTGRESQL_DATABASE: wealthguard
      AZURE_POSTGRESQL_USER: wealthguard
      AZURE_POSTGRESQL_PASSWORD: wealthguard
      AZURE_POSTGRESQL_SSL: "false"
      WG_QUALITY_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build the quality engine jar (tests already ran in test-java)
        working-directory: quality-engine
        run: mvn -B -DskipTests package

      - name: Start the quality engine in the background
        working-directory: quality-engine
        run: |
          nohup java -jar target/quality-engine-*.jar > /tmp/quality-engine.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/pyproject.toml

      - name: Install the pipeline package
        working-directory: data-pipeline
        run: pip install -e ".[dev,assistant]"

      - name: pytest (unit + integration -- Postgres and the engine are both live)
        working-directory: data-pipeline
        run: pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload Python coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-report
          path: data-pipeline/coverage.xml
          retention-days: 7

      - name: Quality engine logs
        if: always()
        run: cat /tmp/quality-engine.log

  test-frontend:
    name: Test — React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build (runs tsc -b then vite build)
        run: npm run build

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-java, test-python, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package the Spring Boot jar
        working-directory: quality-engine
        run: mvn -B -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: quality-engine-jar
          path: quality-engine/target/quality-engine-*.jar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/pyproject.toml
      - name: Package the pipeline wheel
        working-directory: data-pipeline
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wealthguard-pipeline-wheel
          path: data-pipeline/dist/*

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend bundle
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-azure:
    name: Deploy — Azure (quality-engine)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-java, test-python, test-frontend]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package the Spring Boot jar
        working-directory: quality-engine
        run: mvn -B -DskipTests package
      # OIDC federated login (azure/setup.sh): no client secret stored anywhere,
      # GitHub can only obtain a token for this exact repo's main branch.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the jar to Azure App Service (free F1 tier)
        uses: azure/webapps-deploy@v3
        with:
          app-name: wealthguard-quality-engine
          package: quality-engine/target/quality-engine-*.jar

  # Data-pipeline (Azure Functions) and Blob Storage are documented but not
  # deployed here -- the F1 App Service above already demonstrates a real,
  # working Azure deployment (and unblocks live data on the public GitHub
  # Pages dashboard below) at zero ongoing cost; see ARCHITECTURE.md.
  deploy-pipeline-simulated:
    name: Deploy — data-pipeline & storage (simulated)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build
    steps:
      - name: Deploy — documented, not wired up
        run: |
          echo "::notice title=Deployment simulated::Wiring quality-engine to Azure (see deploy-azure above) covers the highest-value case for a portfolio demo without provisioning paid-tier services (PostgreSQL Flexible Server has no free tier)."
          echo "A real deployment from here would additionally:"
          echo "  - az functionapp deployment source config-zip ... (data-pipeline, as an Azure Function)"
          echo "  - az storage blob upload-batch ... (landing files / reports, to Azure Blob Storage)"
          echo "  - Azure Database for PostgreSQL Flexible Server, replacing the local docker-compose Postgres"

  deploy-pages:
    name: Deploy — GitHub Pages (frontend demo)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [test-java, test-python, test-frontend]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - name: Build with the /WealthGuard/ base path, pointed at the live engine
        working-directory: frontend
        env:
          VITE_QUALITY_API_URL: https://wealthguard-quality-engine.azurewebsites.net
        run: npm run build -- --mode gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4

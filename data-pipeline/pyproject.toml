[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wealthguard-pipeline"
version = "1.0.0"
description = "WealthGuard data pipeline: ingestion, quality orchestration, portfolio indicators"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.40"]
assistant = [
    "langchain>=0.3",
    "langchain-groq>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
]
azure = [
    "azure-functions>=1.18",
    "azure-storage-blob>=12.19",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[project.scripts]
wg-generate-seed = "wealthguard_pipeline.seed.generate:main"
wg-run-pipeline = "wealthguard_pipeline.main:main"
wg-export-frontend-fixture = "wealthguard_pipeline.seed.export_frontend_fixture:main"
wg-ask = "wealthguard_pipeline.assistant.cli:main"

[tool.setuptools.packages.find]
include = ["wealthguard_pipeline*"]

[tool.setuptools.package-data]
wealthguard_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires an external service (PostgreSQL or the Java quality API)",
]

[tool.coverage.run]
source = ["wealthguard_pipeline"]
omit = ["*/azure_function/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
